[mqtt]
host = "127.0.0.1"
port = 1883
basetopic = "emon"
client_id = "energy-feed-weather-opio"
qos = 0
tls = false
connect_timeout_seconds = 15
publish_timeout_seconds = 10

# Set these to environment-variable names when the broker requires credentials.
# For example: username_env = "MQTT_USERNAME"
#              password_env = "MQTT_PASSWORD"
# Keep the credentials themselves out of this file.
# username_env = "MQTT_USERNAME"
# password_env = "MQTT_PASSWORD"

[collectors.weather_api]
latitude = 43.66862
longitude = 6.98212
timezone = "Europe/Paris"
node = "weather_opio"
key = "temperature_c"
interval_seconds = 300
request_timeout_seconds = 15

# Enable after obtaining a personal token from https://conso.boris.sh/.
# [collectors.enedis_conso]
# point_id = "12345678901234"
# token_env = "CONSO_API_TOKEN"
# emoncms_url = "https://emoncms.example"
# feed_id = 123
# emoncms_api_key_env = "EMONCMS_WRITE_API_KEY"
# node = "enedis_linky"
# key = "consumption_wh"
# interval_seconds = 86400
# lookback_days = 3
# request_timeout_seconds = 20

[collectors.ds18b20]
devices_path = "/sys/bus/w1/devices"
node = "ds18b20"
interval_seconds = 2

[collectors.yf_b10]
gpio_pin = 16
node = "yf_b10"
interval_seconds = 2

[collectors.refoss_em06]
# Leave empty when there is only one EM06 on the local network.
device_uuid = ""
node = "refoss_em06"
interval_seconds = 2
discovery_timeout_seconds = 5
request_timeout_seconds = 15
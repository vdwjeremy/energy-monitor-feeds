[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-monitor-feeds"
version = "0.1.0"
description = "Python collectors publishing measurements to EmonCMS over MQTT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "requests>=2.31,<3",
    "aiohttp>=3.9,<4",
    "gpiozero>=2.0,<3",
    "refoss-ha>=1.2.5,<2; python_version >= '3.11'",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
energy-feed = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "config", "logging_config", "models", "mqtt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["collectors*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]